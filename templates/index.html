<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestionnaire de tâches</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>📋 Mes tâches</h1>

    <form action="/add" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="task-title" class="sr-only">Nouvelle tâche</label>
        <input type="text" id="task-title" name="title" placeholder="Nouvelle tâche..." required>
        <button type="submit">Ajouter</button>
    </form>

    <ul>
        {% for task in tasks %}
        <li class="{{ 'done' if task.done else '' }}">
            {{ task.title }}
            {% if not task.done %}
            <form action="/complete/{{ task.id }}" method="POST" class="inline-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit">✓ Terminé</button>
            </form>
            {% endif %}
        </li>
        {% endfor %}
    </ul>
</body>
</html>
