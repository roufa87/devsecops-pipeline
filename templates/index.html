<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestionnaire de tâches</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #2c3e50; }
        form { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type=text] { flex: 1; padding: 8px; }
        button { padding: 8px 16px; cursor: pointer; }
        ul { list-style: none; padding: 0; }
        li { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        .done { text-decoration: line-through; color: #999; }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    </style>
</head>
<body>
    <h1>📋 Mes tâches</h1>

    <form action="/add" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="task-title" class="sr-only">Nouvelle tâche</label>
        <input type="text" id="task-title" name="title" placeholder="Nouvelle tâche..." required>
        <button type="submit">Ajouter</button>
    </form>

    <ul>
        {% for task in tasks %}
        <li class="{{ 'done' if task.done else '' }}">
            {{ task.title }}
            {% if not task.done %}
            <form action="/complete/{{ task.id }}" method="POST" style="margin:0;">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit">✓ Terminé</button>
            </form>
            {% endif %}
        </li>
        {% endfor %}
    </ul>
</body>
</html>
