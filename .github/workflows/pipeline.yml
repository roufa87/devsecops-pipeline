name: DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    name: Détection de secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Vérifier que l'application démarre
        run: |
          python -c "from app import app; print('Import OK, application valide')"

  sonarqube-scan:
    name: Analyse du code (SonarQube)
    runs-on: self-hosted
    steps:
      - name: Nettoyage préalable (fichiers root éventuels)
        run: |
          if [ -d "$GITHUB_WORKSPACE" ]; then
            docker run --rm -v "$GITHUB_WORKSPACE":/w alpine \
              sh -c "rm -rf /w/deps /w/reports"
          fi

      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan SonarQube
        uses: sonarsource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  dependency-check:
    name: Scan des dépendances (OWASP Dependency-Check)
    runs-on: self-hosted
    steps:
      - name: Nettoyage préalable (fichiers root éventuels)
        run: |
          if [ -d "$GITHUB_WORKSPACE" ]; then
            docker run --rm -v "$GITHUB_WORKSPACE":/w alpine \
              sh -c "rm -rf /w/deps /w/reports"
          fi

      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer les dépendances dans deps/
        run: |
          mkdir -p deps
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e PIP_CACHE_DIR=/tmp/pip \
            -v "$PWD":/src -w /src python:3.12-slim \
            pip install -q -r requirements.txt --target deps

      - name: OWASP Dependency-Check
        run: |
          mkdir -p reports && chmod 777 reports
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD":/src \
            -v "$PWD/reports":/report \
            -v dc-data:/usr/share/dependency-check/data \
            owasp/dependency-check:latest \
            --scan /src/deps \
            --format HTML --format JSON \
            --out /report \
            --enableExperimental \
            --failOnCVSS 7 \
            --nvdApiKey "${{ secrets.NVD_API_KEY }}"

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/

  trivy-scan:
    name: Scan de l'image Docker (Trivy)
    runs-on: self-hosted
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Build de l'image
        run: docker build -t taskmanager:${{ github.sha }} .

      - name: Trivy - rapport complet (informatif)
        run: |
          mkdir -p reports
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache/ \
            aquasec/trivy:latest image \
            --severity CRITICAL,HIGH \
            --exit-code 0 \
            taskmanager:${{ github.sha }} > reports/trivy-complet.txt

      - name: Trivy - blocage (CVE corrigeables HIGH/CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache/ \
            aquasec/trivy:latest image \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            taskmanager:${{ github.sha }}

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: reports/

  deploy:
    name: Déploiement (Docker Compose)
    runs-on: self-hosted
    needs: [secret-scan, build-and-test, sonarqube-scan, dependency-check, trivy-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Nettoyage préalable (fichiers root éventuels)
        run: |
          if [ -d "$GITHUB_WORKSPACE" ]; then
            docker run --rm -v "$GITHUB_WORKSPACE":/w alpine \
              sh -c "rm -rf /w/deps /w/reports"
          fi

      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Déploiement
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
        run: docker compose up -d --build

      - name: Smoke test
        run: |
          for i in $(seq 1 15); do
            curl -fs http://localhost:5000/health && exit 0
            sleep 2
          done
          docker compose logs app
          exit 1

  dast:
    name: Test dynamique (OWASP ZAP)
    runs-on: self-hosted
    needs: deploy
    steps:
      - name: Attendre l'application
        run: |
          for i in $(seq 1 15); do
            curl -fs http://localhost:5000/health && exit 0
            sleep 2
          done
          exit 1

      - name: Scan ZAP (baseline)
        run: |
          mkdir -p zap-reports && chmod 777 zap-reports
          docker run --rm \
            --add-host host.docker.internal:host-gateway \
            -v "$PWD/zap-reports":/zap/wrk:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://host.docker.internal:5000 \
            -r zap-rapport.html -I

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-reports/
