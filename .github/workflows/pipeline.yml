name: DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    name: Détection de secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Vérifier que l'application démarre
        run: |
          python -c "from app import app; print('Import OK, application valide')"

  sonarqube-scan:
    name: Analyse du code (SonarQube)
    runs-on: self-hosted
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan SonarQube
        uses: sonarsource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  dependency-check:
    name: Scan des dépendances (OWASP Dependency-Check)
    runs-on: self-hosted
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer les dépendances dans deps/
        run: |
          docker run --rm -v "$PWD":/src alpine rm -rf /src/deps
          mkdir -p deps
          docker run --rm -v "$PWD":/src -w /src python:3.12-slim \
            pip install -q -r requirements.txt --target deps

      - name: OWASP Dependency-Check
        run: |
          mkdir -p reports && chmod 777 reports
          docker run --rm \
            -v "$PWD":/src \
            -v "$PWD/reports":/report \
            -v dc-data:/usr/share/dependency-check/data \
            owasp/dependency-check:latest \
            --scan /src/deps \
            --format HTML --format JSON \
            --out /report \
            --enableExperimental \
            --failOnCVSS 7 \
            --nvdApiKey "${{ secrets.NVD_API_KEY }}"

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/
